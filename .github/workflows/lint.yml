name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'
  GOTOOLCHAIN: local

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.quality != '[]' }}
    name: Lint / ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.quality) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.mod
            **/go.sum
      - name: Install pinned golangci-lint
        uses: ./.github/actions/setup-ci-tool
        with:
          tool: golangci-lint
      - name: Check module policy
        env:
          MODULE: ${{ matrix.module }}
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint-cache
        run: bash scripts/check-lint.sh "$MODULE"

  gate:
    name: Lint gate
    if: ${{ always() }}
    needs: [changes, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Require selection and selected checks to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-gate.py --job lint:quality
