name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository policy and upstream history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject workflows restored inside subtrees
        run: python3 scripts/verify-ci-layout.py
      - name: Verify original upstream commits and import trees
        if: always()
        run: python3 scripts/verify-upstreams.py
