name: Extended platforms

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '13 4 * * 0'

permissions:
  contents: read

concurrency:
  group: extended-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOWORK: off
  # These upstream checks exercise pure Go/assembly. The native 386 compiler
  # otherwise enables cgo and requires unrelated 32-bit C system headers.
  CGO_ENABLED: '0'

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  platforms:
    needs: changes
    if: ${{ needs.changes.outputs.extended != '[]' }}
    name: ${{ matrix.module }} / ${{ matrix.entry }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.extended) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          architecture: ${{ matrix.arch }}
          cache-dependency-path: |
            **/go.mod
            **/go.sum
      - name: Run the upstream extended platform entry point
        env:
          MODULE: ${{ matrix.module }}
          MODE: ${{ matrix.mode }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          REQUIRE_SIMDJSON_CPU: '0'
        run: |
          go version
          test "$(go env GOHOSTARCH)" = "$EXPECTED_ARCH"
          bash scripts/check-modules.sh "$MODE" "$MODULE"

  gate:
    name: Extended platforms gate
    if: ${{ always() }}
    needs: [changes, platforms]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Require selection and selected checks to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-gate.py --job platforms:extended
