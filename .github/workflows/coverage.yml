name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOWORK: off

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  coverage:
    needs: changes
    if: ${{ needs.changes.outputs.runtime != '[]' }}
    name: ${{ matrix.module }} / race + atomic coverage
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.module == 'simdjson-go' && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.runtime) }}
    env:
      MODULE: ${{ matrix.module }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.work
        cache-dependency-path: |
          **/go.mod
          **/go.sum
    - name: Record tested source
      id: source
      shell: bash
      run: |
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Remove stale generated report evidence
      id: report_cleanup
      shell: bash
      run: |
        set -euo pipefail
        test ! -L .github
        test ! -L .github/reports
        mkdir -p ".github/reports/${{ matrix.module }}"
        test ! -L ".github/reports/${{ matrix.module }}"
        rm -f -- ".github/reports/${{ matrix.module }}/"*.md ".github/reports/${{ matrix.module }}/"*.json ".github/reports/${{ matrix.module }}/"*.svg
    - name: Validate native report environment
      shell: bash
      run: bash scripts/check-reports.sh environment "${{ matrix.module }}" "reports/coverage/${{ matrix.module }}"
    - name: Test, race and coverage (GTR v1.1.2)
      id: go_test_report
      uses: soulteary/go-test-report-action@bf04b539f7bf2a6f67d602da4259904b3dcdeba1
      with:
        directory: ${{ matrix.module }}
        version: v1.1.2
        packages: ./...
        race: 'true'
        cover_mode: atomic
        coverage_threshold: '0'
        test_args: -v -count=1
        timeout: ${{ matrix.module == 'simdjson-go' && '20m' || '10m' }}
        commit: 'false'
        report_output: .github/reports/${{ matrix.module }}/go-test-report.md
        json_output: .github/reports/${{ matrix.module }}/go-test-report.json
        badge_output: .github/reports/${{ matrix.module }}/coverage.svg
        raw_output: reports/coverage/${{ matrix.module }}/raw
    - name: Go quality report (v1.1.3)
      id: go_report_card
      uses: soulteary/goreportcard-action@fc43049a5fe61c3313294d217c2a783f375a7970
      if: "!cancelled() && steps.report_cleanup.outcome == 'success'"
      with:
        directory: ${{ matrix.module }}
        version: v1.1.3
        threshold: '0'
        report: 'true'
        commit: 'false'
        output: .github/reports/${{ matrix.module }}/goreportcard.svg
        report_output: .github/reports/${{ matrix.module }}/goreportcard-report.md
    - name: Preserve module profile and test log
      if: always() && steps.report_cleanup.outcome == 'success'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: coverage-${{ matrix.module }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .github/reports/${{ matrix.module }}/
          reports/coverage/${{ matrix.module }}/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
  gate:
    name: Coverage gate
    if: ${{ always() }}
    needs: [changes, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Require selection and selected checks to succeed
      env:
        CI_NEEDS_JSON: ${{ toJSON(needs) }}
      run: python3 scripts/check-ci-gate.py --job coverage:runtime
