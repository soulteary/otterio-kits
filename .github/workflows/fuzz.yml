name: Fuzz

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  pull_request:
permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOWORK: off
  FUZZTIME: 1m
  FUZZ_PARALLEL: '2'

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  fuzz:
    needs: changes
    if: ${{ needs.changes.outputs.fuzz != '[]' }}
    name: ${{ matrix.module }} / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.fuzz) }}
    env:
      MODULE: ${{ matrix.module }}
      FUZZ_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.mod
            **/go.sum
      - name: Run one exact fuzz target for a bounded duration
        run: bash scripts/check-reports.sh fuzz "$MODULE" "$FUZZ_TARGET" "reports/fuzz/$MODULE/$FUZZ_TARGET"
      - name: Preserve inputs, environment and failure log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-${{ matrix.module }}-${{ matrix.target }}
          path: reports/fuzz/${{ matrix.module }}/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  gate:
    name: Fuzz gate
    if: ${{ always() }}
    needs: [changes, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Require selection and selected checks to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-gate.py --job fuzz:fuzz
