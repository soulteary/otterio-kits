# Migrated by otterio-kits maintainers on 2026-10-08 from the imported v1 policy.
version: "2"
linters:
  default: none
  enable:
    - misspell
    - govet
    - revive
    - ineffassign
    - staticcheck
    - unparam
    - unused
  settings:
    misspell:
      locale: US
    staticcheck:
      # The old gosimple linter is part of staticcheck in v2.
      checks: ["S*"]
  exclusions:
    # Preserve the old exclusions rather than enabling v2 common presets.
    presets: []
    rules:
      - linters: [revive]
        text: should have a package comment
      - linters: [revive]
        text: error strings should not be capitalized or end with punctuation or a newline
      - linters: [revive]
        text: should have comment
formatters:
  enable:
    - goimports
